version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: pulsedesk_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pulsedesk
      POSTGRES_PASSWORD: pulsedesk_secret
      POSTGRES_DB: pulsedesk
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
